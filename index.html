<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>متجر مستر فون</title>
<link rel="icon" href="img/logo.jpg">
<style>
  :root { --bg:#0b0b0b; --card:#1a1a1a; --orange:#ff7a00; --text:#fff; --muted:#aaa; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:Tahoma, Arial, sans-serif; }
  header { padding:24px 32px; border-bottom:3px solid var(--orange); display:flex; align-items:center; gap:16px; }
  .logo { width:170px; height:170px; border-radius:24px; object-fit:cover; background:#000; flex-shrink:0; }
  h1 { margin:0; font-size:30px; }
  h1 span { color:var(--orange); }
  header p { margin:4px 0 0; color:var(--muted); }
  nav { padding:16px 32px; display:flex; gap:12px; flex-wrap:wrap; }
  nav button, .dl { font:inherit; border:2px solid transparent; cursor:pointer; outline:none; }
  nav button { background:var(--card); color:var(--text); padding:10px 22px; border-radius:24px; font-size:18px; }
  nav button.on { background:var(--orange); color:#000; font-weight:bold; }
  main { padding:8px 32px 40px; display:grid; grid-template-columns:repeat(auto-fill, minmax(220px, 1fr)); gap:20px; }
  .card { background:var(--card); border-radius:16px; padding:20px; text-align:center; }
  .icon { width:96px; height:96px; border-radius:20px; margin:0 auto 12px; display:flex; align-items:center; justify-content:center; font-size:44px; font-weight:bold; background:#fff; overflow:hidden; }
  .icon img { width:100%; height:100%; object-fit:contain; }
  .name { font-size:20px; font-weight:bold; }
  .ver { color:var(--muted); margin:4px 0 14px; direction:ltr; }
  .dl { display:block; width:100%; padding:12px; border-radius:10px; background:var(--orange); color:#000; font-size:18px; font-weight:bold; text-decoration:none; }
  nav button:focus, .dl:focus { border-color:#fff; transform:scale(1.06); box-shadow:0 0 0 4px rgba(255,122,0,.5); }
  footer { text-align:center; color:var(--muted); padding:20px; }
  @media (max-width:600px) { .logo { width:130px; height:130px; border-radius:20px; } header, nav, main { padding-left:16px; padding-right:16px; } main { grid-template-columns:repeat(2, 1fr); gap:12px; } }
</style>
</head>
<body>
<header>
  <img class="logo" src="img/logo.jpg" alt="مستر فون">
  <div>
    <h1>متجر <span>مستر فون</span></h1>
    <p>اضغط تحميل وبعدين تثبيت</p>
  </div>
</header>
<nav id="cats"></nav>
<main id="apps"></main>
<footer>مستر فون - Mister Phone</footer>
<script>
let apps = [], cat = 'الكل';
function render() {
  const cats = ['الكل', ...new Set(apps.map(a => a.category))];
  document.getElementById('cats').innerHTML = cats.map(c =>
    `<button class="${c === cat ? 'on' : ''}" data-c="${c}">${c}</button>`).join('');
  document.querySelectorAll('#cats button').forEach(b => b.onclick = () => { cat = b.dataset.c; render(); });
  document.getElementById('apps').innerHTML = apps.filter(a => cat === 'الكل' || a.category === cat).map(a => `
    <div class="card">
      <div class="icon" style="${a.icon ? '' : 'background:' + (a.color || '#ff7a00') + ';color:#fff'}">
        ${a.icon ? `<img src="${a.icon}" alt="">` : a.name.charAt(0)}
      </div>
      <div class="name">${a.name}</div>
      <div class="ver">v ${a.version}</div>
      <a class="dl" href="${a.file}">تحميل</a>
    </div>`).join('');
}
fetch('apps.json?' + Date.now()).then(r => r.json()).then(d => { apps = d; render(); const f = document.querySelector('.dl'); if (f) f.focus(); });
</script>
</body>
</html>
